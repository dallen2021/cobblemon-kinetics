version: 2

updates:
  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: "build(deps)"
    groups:
      non-major-gradle-dependencies:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    # The Minecraft/NeoForge/Create/Cobblemon stack is a coordinated
    # compatibility target. Upgrade it deliberately and test it in-game rather
    # than accepting independent automated bumps.
    ignore:
      - dependency-name: "net.minecraft:minecraft"
      - dependency-name: "net.neoforged:neoforge"
      - dependency-name: "com.cobblemon:*"
      - dependency-name: "com.simibubi.create:*"
      - dependency-name: "net.createmod.ponder:*"
      - dependency-name: "dev.engine-room.flywheel:*"
      - dependency-name: "com.tterrag.registrate:*"
      - dependency-name: "thedarkcolour:kotlinforforge-neoforge"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: "ci(deps)"
    groups:
      non-major-github-actions:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
