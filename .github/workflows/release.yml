name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: ./gradlew --no-daemon build

      - name: Locate distributable JAR
        id: distributable
        shell: bash
        run: |
          mapfile -t jars < <(
            find build/libs -maxdepth 1 -type f -name '*.jar' \
              ! -name '*-sources.jar' \
              ! -name '*-javadoc.jar' \
              ! -name '*-dev.jar' \
              ! -name '*-dev-shadow.jar' \
              ! -name '*-shadow.jar' \
              -print | sort
          )

          if [[ ${#jars[@]} -ne 1 ]]; then
            echo "Expected exactly one distributable JAR, found ${#jars[@]}:" >&2
            printf '  %s\n' "${jars[@]}" >&2
            exit 1
          fi

          echo "path=${jars[0]}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release and attach JAR
        env:
          GH_TOKEN: ${{ github.token }}
          JAR_PATH: ${{ steps.distributable.outputs.path }}
        shell: bash
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$JAR_PATH" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$JAR_PATH" \
              --verify-tag \
              --generate-notes \
              --title "Create: Cobblemon Kinetics $GITHUB_REF_NAME"
          fi
