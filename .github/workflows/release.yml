name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle and validate wrapper
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          validate-wrappers: true

      - name: Validate tag and derive release version
        id: release
        shell: bash
        run: |
          set -euo pipefail

          tag="$GITHUB_REF_NAME"
          if [[ ! "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            echo "Release tags must look like v1.2.3 or v1.2.3-beta.1; got: $tag" >&2
            exit 1
          fi

          version="${tag#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and test
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: ./gradlew --no-daemon -Pmod_version="$RELEASE_VERSION" clean build

      - name: Locate distributable JAR and write checksum
        id: distributable
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t jars < <(
            find build/libs -maxdepth 1 -type f -name '*.jar' \
              ! -name '*-sources.jar' \
              ! -name '*-javadoc.jar' \
              ! -name '*-dev.jar' \
              ! -name '*-dev-shadow.jar' \
              ! -name '*-shadow.jar' \
              -print | sort
          )

          if [[ ${#jars[@]} -ne 1 ]]; then
            echo "Expected exactly one distributable JAR, found ${#jars[@]}:" >&2
            printf '  %s\n' "${jars[@]}" >&2
            exit 1
          fi

          echo "path=${jars[0]}" >> "$GITHUB_OUTPUT"
          checksum_path="build/libs/SHA256SUMS"
          (
            cd build/libs
            sha256sum "$(basename "${jars[0]}")" > SHA256SUMS
          )
          echo "checksum=$checksum_path" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release and attach JAR
        env:
          GH_TOKEN: ${{ github.token }}
          JAR_PATH: ${{ steps.distributable.outputs.path }}
          CHECKSUM_PATH: ${{ steps.distributable.outputs.checksum }}
          IS_PRERELEASE: ${{ steps.release.outputs.prerelease }}
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$JAR_PATH" "$CHECKSUM_PATH" --clobber
          else
            release_args=(
              "$GITHUB_REF_NAME"
              "$JAR_PATH"
              "$CHECKSUM_PATH"
              --verify-tag
              --generate-notes
              --title "Create: Cobblemon Kinetics $GITHUB_REF_NAME"
            )
            if [[ "$IS_PRERELEASE" == "true" ]]; then
              release_args+=(--prerelease)
            fi
            gh release create "${release_args[@]}"
          fi
